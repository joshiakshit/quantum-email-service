# Host nginx for qmail.joshiakshit.live. The app runs in Docker bound to
# 127.0.0.1:9000 (see docker-compose.yml); nginx terminates TLS and proxies to it.
# Certs are issued with: sudo certbot --nginx -d qmail.joshiakshit.live

server {
    listen 80;
    server_name qmail.joshiakshit.live www.qmail.joshiakshit.live;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name qmail.joshiakshit.live www.qmail.joshiakshit.live;

    ssl_certificate /etc/letsencrypt/live/qmail.joshiakshit.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qmail.joshiakshit.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
