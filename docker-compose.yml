services:
  qmail:
    image: ghcr.io/joshiakshit/qmail:latest
    build: .
    container_name: qmail
    restart: unless-stopped
    environment:
      - QMAIL_KM_URL=http://localhost:8000
      - QMAIL_AUTH_URL=https://auth.joshiakshit.live
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your environment}
      - DEBUG=false

networks:
  default:
    name: shared
    external: true
